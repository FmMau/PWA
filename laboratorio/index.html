<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba del scope estrecho</title>
<h1>Scope estrecho</h1>
<pre id="result"></pre>
<a href="../#/diagnostico">Volver al diagnóstico</a>
<script type="module">
  const output = document.querySelector('#result');
  if ('serviceWorker' in navigator) {
    const registration = await navigator.serviceWorker.getRegistration(location.href);
    output.textContent = `Registro coincidente: ${registration?.scope ?? 'ninguno'}\nController: ${navigator.serviceWorker.controller?.scriptURL ?? 'null'}\nEstado: ${navigator.serviceWorker.controller?.state ?? 'ninguno'}`;
  } else output.textContent = 'Service Workers no disponibles.';
</script>
</html>
